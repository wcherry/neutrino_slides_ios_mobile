name: NeutrinoSlides
packages:
  swift-sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: "0.9.1"
  # The code shared with the other Neutrino iOS apps: account identity, the
  # OAuth/PKCE flow, the E2EE key lifecycle and the sign-in screens.
  #
  # A local path, so the two repositories have to sit side by side. Swap this for
  # `url:` + `from:` once neutrino_shared_ios is pushed and tagged.
  NeutrinoShared:
    path: ../neutrino_shared_ios
options:
  bundleIdPrefix: com.neutrino
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16"

targets:
  NeutrinoSlides:
    type: application
    platform: iOS
    sources:
      - path: NeutrinoSlides
    dependencies:
      # swift-sodium is the only dependency, and it is the same one every Neutrino iOS app uses for
      # the E2EE primitives. No PPTX reader: a deck stored as OOXML is Epic 22 (office mode), and a
      # zip parser has no other caller here.
      - package: swift-sodium
        product: Sodium
      - package: NeutrinoShared
        product: NeutrinoCore
      - package: NeutrinoShared
        product: NeutrinoAuth
      - package: NeutrinoShared
        product: NeutrinoCrypto
      - package: NeutrinoShared
        product: NeutrinoUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neutrino.slides
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        DEVELOPMENT_TEAM: "46KWJJ63FU"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: NeutrinoSlides/NeutrinoSlides.entitlements
      properties:
        # Cross-app Keychain access group, declared by all six Neutrino apps. Holds the
        # identity keyring and nothing else — sessions stay namespaced per app — so a key
        # imported in one app is a key the others already have. See
        # NeutrinoAppConfig.sharedIdentityGroup in neutrino_shared_ios.
        keychain-access-groups:
          # This app's own group first, and it must stay first: the *default* access group — where
          # an item written without an explicit group lands — is the first entry in this list. Left
          # implicit, adding the shared group below would silently make it the default and start
          # writing this app's access and refresh tokens into a container the other five can read.
          - $(AppIdentifierPrefix)$(CFBundleIdentifier)
          - $(AppIdentifierPrefix)com.neutrino.shared
        # Universal Links: `https://www.getneutrino.app/open/slide/<file id>` opens a deck here
        # instead of in Safari. Both host spellings are claimed so a link pasted without the "www."
        # still resolves.
        #
        # The entitlement is claimed now, but which *paths* reach this app is decided by the
        # apple-app-site-association document served from the domain — and today that file routes
        # `/open/slide/*` to `com.neutrino.drive`. Moving it is Epic 20, sequenced with the App
        # Store release. Until then `FeatureFlags.appLinks` is off and iOS never delivers those
        # links here anyway.
        com.apple.developer.associated-domains:
          - applinks:www.getneutrino.app
          - applinks:getneutrino.app
    info:
      path: NeutrinoSlides/Info.plist
      properties:
        CFBundleName: Neutrino Slides
        CFBundleDisplayName: Neutrino Slides
        # Without these, xcodegen writes literal "1.0"/"1" into Info.plist and the
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION build settings are ignored.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # actool writes only the *nested* CFBundleIcons > CFBundlePrimaryIcon >
        # CFBundleIconName. The top-level key is normally added by Xcode's Info.plist generation,
        # which this target doesn't use (it has an explicit Info.plist), so declare it here — App
        # Store Connect rejects the upload with error 90713 without it.
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        # A slide is 16:9, so landscape is where a deck is actually read: presenting in portrait
        # letterboxes the canvas to about a third of the screen.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Neutrino Slides uses Face ID to unlock your end-to-end encrypted presentations."
        NSCameraUsageDescription: "Neutrino Slides needs camera access to scan the QR code that carries your encryption key."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Neutrino Slides Key File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.neutrino.slides.keyfile
            UTTypeConformsTo:
              - public.json
            UTTypeDescription: Neutrino Slides Key File
            UTTypeTagSpecification:
              public.filename-extension:
                - json

  NeutrinoSlidesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NeutrinoSlidesTests
    dependencies:
      - target: NeutrinoSlides
    settings:
      base:
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
